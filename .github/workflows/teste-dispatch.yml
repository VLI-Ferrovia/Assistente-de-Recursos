name: Atualizar Bases CCO

on:
  repository_dispatch:
    types: [atualizar-csv]

jobs:
  salvar-dados:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v3

      - name: Decodificar e Salvar o Ficheiro CSV
        run: |
          echo "${{ github.event.client.payload.csv_base64 }}" | base64 --decode > "${{ github.event.client.payload.arquivo }}"

      - name: Enviar Alterações para o Repositório
        run: |
          git config --global user.name "Robo Automacao CCO"
          git config --global user.email "automacao@vli.com"
          git add "${{ github.event.client.payload.arquivo }}"
          git commit -m "Atualizacao automatica do ficheiro ${{ github.event.client.payload.arquivo }}"
          git push
