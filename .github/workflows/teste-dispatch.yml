name: Teste Dispatch

on:
  repository_dispatch:
    types: [atualizar-recursos]

jobs:
  teste:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Criar arquivo
        run: |
          echo '${{ toJson(github.event.client_payload) }}' > teste.json

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add teste.json

          git diff --staged --quiet || git commit -m "atualizacao"

          git push
